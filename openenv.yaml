id: email-env
name: Email Management Environment
description: AI agent classifies and responds to emails sequentially.

entry_point: env:EmailEnv

observation_space:
  type: dict
  description: Current email with text and label fields

action_space:
  type: string
  description: Classification (important or spam) or reply text

reward:
  type: float
  description: +1.0 correct, +0.8 meeting reply, -0.5 wrong. Normalized 0.0 to 1.0.

tasks:
  - name: easy
    description: Classify emails as important or spam correctly.
    max_steps: 3
    grader:
      type: reward_threshold
      threshold: 0.5
      normalize: true

  - name: medium
    description: Classify and reply to meeting emails with attend keyword.
    max_steps: 3
    grader:
      type: reward_threshold
      threshold: 0.7
      normalize: true

  - name: hard
    description: Achieve near perfect score across all emails.
    max_steps: 3
    grader:
      type: reward_threshold
      threshold: 0.9
      normalize: true
